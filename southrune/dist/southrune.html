<title>SOUTHRUNE</title>

<style>
/* Layout: 4:3 pixel-art game screen; on touch devices, D-pad on the left and Z/X/C buttons on the right. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --fg: #ffffff;
  --muted: #8a8aa8;
  --panel: #0d0718;
  --line: #ffffff;
  --accent: #ff9a1f;
  --hot: #ffff00;
  --soul: #ff1a1a;
  --font-ui: "Press Start 2P", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-hint: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
html { height: 100%; box-sizing: border-box; background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg);
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#app {
  height: 100%; display: flex; flex-direction: column; position: relative;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
}
#stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
#screen { display: block; background: var(--bg); image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
#fs {
  position: absolute; top: 4px; right: 0; width: 34px; height: 34px; border: 2px solid var(--line); border-radius: 4px;
  background: rgba(0, 0, 0, 0.55); color: var(--fg); font: 14px/1 var(--font-hint); opacity: 0.45; cursor: pointer; padding: 0;
}
#fs:hover, #fs:focus-visible { opacity: 1; outline: 2px solid var(--hot); outline-offset: 2px; }
#hint {
  flex: 0 0 auto; text-align: center; color: var(--muted); font: 12px/1.6 var(--font-hint); letter-spacing: 0.04em;
  padding-top: 6px; text-wrap: balance;
}
#hint b { color: var(--fg); font-weight: 700; }
#controls { display: none; }
body.touch #hint { display: none; }
body.touch #controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
body.touch.portrait #stage { flex: 0 0 auto; }
body.touch.portrait #controls { flex: 1 1 auto; min-height: 0; padding: 8px 4px; }
body.touch.landscape #controls {
  position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  bottom: 10px; pointer-events: none;
}
body.touch.landscape #controls > * { pointer-events: auto; opacity: 0.6; }

/* D-pad */
#dpad { position: relative; width: 156px; height: 156px; flex: 0 0 auto; touch-action: none; }
#dpad .arm { position: absolute; background: var(--panel); border: 2px solid var(--line); }
#dpad .h { left: 0; right: 0; top: 50px; height: 56px; border-radius: 6px; }
#dpad .v { top: 0; bottom: 0; left: 50px; width: 56px; border-radius: 6px; }
#dpad .hub { position: absolute; left: 52px; top: 52px; width: 52px; height: 52px; background: var(--panel); }
#dpad .arr { position: absolute; width: 0; height: 0; border: 10px solid transparent; }
#dpad .up { left: 68px; top: 10px; border-bottom: 14px solid var(--fg); border-top-width: 0; }
#dpad .down { left: 68px; bottom: 10px; border-top: 14px solid var(--fg); border-bottom-width: 0; }
#dpad .left { top: 68px; left: 10px; border-right: 14px solid var(--fg); border-left-width: 0; }
#dpad .right { top: 68px; right: 10px; border-left: 14px solid var(--fg); border-right-width: 0; }
#dpad.on-up .up { border-bottom-color: var(--hot); }
#dpad.on-down .down { border-top-color: var(--hot); }
#dpad.on-left .left { border-right-color: var(--hot); }
#dpad.on-right .right { border-left-color: var(--hot); }
#dpad .knob {
  position: absolute; left: 62px; top: 62px; width: 32px; height: 32px; border-radius: 50%;
  background: var(--soul); clip-path: polygon(50% 100%, 0 38%, 12% 8%, 34% 4%, 50% 22%, 66% 4%, 88% 8%, 100% 38%);
  transform: none; transition: transform 60ms linear; pointer-events: none;
}

/* Z / X / C buttons */
#btns { display: grid; grid-template-columns: repeat(2, auto); grid-template-rows: auto auto; gap: 10px 14px; align-items: center; flex: 0 0 auto; }
.btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); color: var(--fg);
  font-family: var(--font-ui); padding: 0; touch-action: none; cursor: pointer;
}
.btn b { font-size: 16px; font-weight: 400; }
.btn small { font-size: 6px; letter-spacing: 0.06em; color: var(--muted); }
.btn.on { background: var(--hot); color: #000; }
.btn.on small { color: #000; }
.btn:focus-visible { outline: 2px solid var(--hot); outline-offset: 3px; }
#bC { grid-column: 2; grid-row: 1; justify-self: center; width: 54px; height: 54px; }
#bX { grid-column: 1; grid-row: 2; }
#bZ { grid-column: 2; grid-row: 2; width: 76px; height: 76px; border-color: var(--hot); }
#bZ b { font-size: 20px; }

@media (max-height: 420px) and (orientation: landscape) {
  #dpad { transform: scale(0.85); transform-origin: left bottom; }
  #btns { transform: scale(0.85); transform-origin: right bottom; }
}
@media (prefers-reduced-motion: reduce) { #dpad .knob { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="screen" width="320" height="240" tabindex="0" role="img" aria-label="SOUTHRUNE game screen"></canvas>
    <button id="fs" type="button" aria-label="Fullscreen" title="Fullscreen">⛶</button>
  </div>
  <div id="hint"><b>Arrows</b> move · <b>Z</b>/<b>Enter</b> confirm · <b>X</b>/<b>Shift</b> back &amp; run · <b>C</b> menu</div>
  <div id="controls">
    <div id="dpad" aria-label="D-pad">
      <span class="arm h"></span><span class="arm v"></span><span class="hub"></span>
      <span class="arr up"></span><span class="arr down"></span><span class="arr left"></span><span class="arr right"></span>
      <span class="knob"></span>
    </div>
    <div id="btns">
      <button id="bC" class="btn" type="button" data-b="menu" aria-label="Menu (C)"><b>C</b><small>MENU</small></button>
      <button id="bX" class="btn" type="button" data-b="cancel" aria-label="Back and run (X)"><b>X</b><small>BACK</small></button>
      <button id="bZ" class="btn" type="button" data-b="confirm" aria-label="Confirm (Z)"><b>Z</b><small>OK</small></button>
    </div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   SOUTHRUNE — jogo de fã inspirado em DELTARUNE (Toby Fox),
   estrelando Stan, Kyle, Kenny e Cartman (South Park) e um Goomba de capa.
   Núcleo: constantes, utilidades, corrotinas, entrada (teclado/toque), tela.
   ===================================================================== */

const W = 320, H = 240, FPS = 30, STEP_MS = 1000 / FPS;

const U = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  rnd: (a, b) => a + Math.random() * (b - a),
  irnd: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  ang: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  sign: (v) => (v > 0 ? 1 : v < 0 ? -1 : 0),
  approach: (v, t, s) => (v < t ? Math.min(v + s, t) : Math.max(v - s, t)),
  overlap: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  hash(x, y, s = 0) {
    let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  },
  shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  },
  pad: (n, len, ch = ' ') => String(n).padStart(len, ch),
};

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return c;
}

/* ---------- Corrotinas: esperas e tweens dirigidos pelo laço do jogo ---------- */
let frame = 0;
const _waiters = [];
function wait(n = 1) {
  return new Promise((res) => _waiters.push({ at: frame + Math.max(1, Math.round(n)), res }));
}
function waitFor(cond) { return new Promise((res) => _waiters.push({ cond, res })); }
function _tickWaiters() {
  for (let i = 0; i < _waiters.length; i++) {
    const w = _waiters[i];
    let ok = false;
    try { ok = w.cond ? w.cond() : frame >= w.at; } catch (e) { ok = true; }
    if (ok) { _waiters.splice(i--, 1); w.res(); }
  }
}
const Ease = {
  lin: (t) => t,
  out: (t) => 1 - (1 - t) * (1 - t),
  in: (t) => t * t,
  inout: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  back: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
const _tweens = [];
function tween(obj, props, frames, ease = Ease.out) {
  return new Promise((res) => {
    const from = {};
    for (const k in props) from[k] = obj[k];
    _tweens.push({ obj, from, to: props, n: Math.max(1, Math.round(frames)), t: 0, ease, res });
  });
}
function _tickTweens() {
  for (let i = 0; i < _tweens.length; i++) {
    const tw = _tweens[i];
    tw.t++;
    const k = tw.ease(Math.min(1, tw.t / tw.n));
    for (const p in tw.to) tw.obj[p] = tw.from[p] + (tw.to[p] - tw.from[p]) * k;
    if (tw.t >= tw.n) { _tweens.splice(i--, 1); tw.res(); }
  }
}
/* Abandona todas as corrotinas pendentes (usado ao voltar ao título / game over). */
function abandonAsync() { _waiters.length = 0; _tweens.length = 0; }

/* ---------- Entrada ---------- */
const Input = {
  BUTTONS: ['up', 'down', 'left', 'right', 'confirm', 'cancel', 'menu'],
  held: {},
  pressed: {},
  _pressed: {},
  keyMap: {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    KeyZ: 'confirm', Enter: 'confirm', NumpadEnter: 'confirm', Space: 'confirm',
    KeyX: 'cancel', ShiftLeft: 'cancel', ShiftRight: 'cancel', Backspace: 'cancel', Escape: 'cancel',
    KeyC: 'menu', ControlLeft: 'menu', ControlRight: 'menu',
  },
  down(b) { if (!this.held[b]) this._pressed[b] = true; this.held[b] = true; },
  up(b) { this.held[b] = false; },
  update() { this.pressed = this._pressed; this._pressed = {}; },
  p(b) { return !!this.pressed[b]; },
  h(b) { return !!this.held[b]; },
  take(b) { if (this.pressed[b]) { this.pressed[b] = false; return true; } return false; },
  any() { return this.BUTTONS.some((b) => this.pressed[b]); },
  takeAny() { const a = this.any(); if (a) this.pressed = {}; return a; },
  clear() { this.held = {}; this.pressed = {}; this._pressed = {}; },
  init() {
    window.addEventListener('keydown', (e) => {
      const b = this.keyMap[e.code];
      if (b) {
        e.preventDefault();
        Sfx.unlock();
        if (!e.repeat) this.down(b);
      }
    });
    window.addEventListener('keyup', (e) => {
      const b = this.keyMap[e.code];
      if (b) { e.preventDefault(); this.up(b); }
    });
    for (const ev of ['touchend', 'click', 'mousedown']) document.addEventListener(ev, () => Sfx.unlock(), { passive: true });
    window.addEventListener('blur', () => this.clear());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.clear(); });
  },
};

/* ---------- Controles de toque (direcional + botões Z/X/C) ---------- */
const Touch = {
  enabled: false,
  dirs: { up: false, down: false, left: false, right: false },
  setDirs(nd) {
    for (const d in this.dirs) {
      if (nd[d] && !this.dirs[d]) Input.down(d);
      else if (!nd[d] && this.dirs[d]) Input.up(d);
      this.dirs[d] = !!nd[d];
    }
    const pad = document.getElementById('dpad');
    if (pad) for (const d in this.dirs) pad.classList.toggle('on-' + d, this.dirs[d]);
  },
  init() {
    const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    this.enabled = !!(coarse || 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0);
    document.body.classList.toggle('touch', this.enabled);
    const pad = document.getElementById('dpad');
    const knob = pad && pad.querySelector('.knob');
    let pid = null;
    const aim = (e) => {
      const r = pad.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      const len = Math.hypot(dx, dy), max = r.width / 2;
      const nd = { up: false, down: false, left: false, right: false };
      if (len > max * 0.18) {
        const sector = ((Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) % 8) + 8) % 8;
        // 0 dir, 1 baixo-dir, 2 baixo, 3 baixo-esq, 4 esq, 5 cima-esq, 6 cima, 7 cima-dir
        if (sector === 7 || sector === 0 || sector === 1) nd.right = true;
        if (sector >= 1 && sector <= 3) nd.down = true;
        if (sector >= 3 && sector <= 5) nd.left = true;
        if (sector >= 5 && sector <= 7) nd.up = true;
      }
      const k = Math.min(1, len / max) * max * 0.45;
      if (knob) knob.style.transform = len > 1 ? `translate(${(dx / len) * k}px, ${(dy / len) * k}px)` : '';
      this.setDirs(nd);
    };
    const release = () => {
      pid = null;
      if (knob) knob.style.transform = '';
      this.setDirs({});
    };
    if (pad) {
      pad.addEventListener('pointerdown', (e) => {
        e.preventDefault(); Sfx.unlock();
        pid = e.pointerId;
        try { pad.setPointerCapture(pid); } catch (err) { /* ok */ }
        aim(e);
      });
      pad.addEventListener('pointermove', (e) => { if (e.pointerId === pid) aim(e); });
      pad.addEventListener('pointerup', (e) => { if (e.pointerId === pid) release(); });
      pad.addEventListener('pointercancel', (e) => { if (e.pointerId === pid) release(); });
      pad.addEventListener('lostpointercapture', (e) => { if (e.pointerId === pid) release(); });
    }
    document.querySelectorAll('[data-b]').forEach((el) => {
      const b = el.dataset.b;
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault(); Sfx.unlock();
        try { el.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
        Input.down(b); el.classList.add('on');
        if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) { /* ok */ } }
      });
      const up = () => { Input.up(b); el.classList.remove('on'); };
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      el.addEventListener('lostpointercapture', up);
      el.addEventListener('contextmenu', (e) => e.preventDefault());
    });
    // Toque na própria tela do jogo = confirmar (ajuda muito nos diálogos).
    const cv = document.getElementById('screen');
    cv.addEventListener('pointerdown', (e) => {
      e.preventDefault(); Sfx.unlock();
      try { cv.focus({ preventScroll: true }); } catch (err) { /* ok */ }
      Input.down('confirm');
      const lift = () => { Input.up('confirm'); window.removeEventListener('pointerup', lift); window.removeEventListener('pointercancel', lift); };
      window.addEventListener('pointerup', lift);
      window.addEventListener('pointercancel', lift);
    });
    // Evita zoom/rolagem acidentais no iOS.
    ['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault()));
    document.addEventListener('touchmove', (e) => { if (e.target.closest && e.target.closest('#app')) e.preventDefault(); }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd < 350 && e.target.closest && e.target.closest('#app')) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
  },
};

/* ---------- Tela: buffer 320x240 ampliado sem suavização ---------- */
const Screen = {
  canvas: null, dctx: null, buf: null, ctx: null,
  init() {
    this.canvas = document.getElementById('screen');
    this.dctx = this.canvas.getContext('2d');
    this.buf = makeCanvas(W, H);
    this.ctx = this.buf.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    const re = () => this.layout();
    window.addEventListener('resize', re);
    window.addEventListener('orientationchange', () => setTimeout(re, 120));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', re);
    this.layout();
    setTimeout(re, 300);
  },
  layout() {
    const app = document.getElementById('app');
    const stage = document.getElementById('stage');
    if (!app || !stage) return;
    const vw = app.clientWidth, vh = app.clientHeight;
    const portrait = vh > vw * 1.08;
    document.body.classList.toggle('portrait', portrait);
    document.body.classList.toggle('landscape', !portrait);
    if (document.body.classList.contains('touch') && portrait) {
      // Retrato: jogo em cima (4:3), controles embaixo.
      const sh = Math.min(Math.round(vw * 0.75), Math.round(vh * 0.6));
      stage.style.height = sh + 'px';
    } else {
      stage.style.height = '';
    }
    const sw = stage.clientWidth, sh = stage.clientHeight;
    let s = Math.min(sw / W, sh / H);
    if (s >= 2) { const f = Math.floor(s); if (s - f < 0.35) s = f; }
    const cw = Math.max(1, Math.floor(W * s)), ch = Math.max(1, Math.floor(H * s));
    this.canvas.style.width = cw + 'px';
    this.canvas.style.height = ch + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    this.canvas.width = Math.round(cw * dpr);
    this.canvas.height = Math.round(ch * dpr);
    this.dctx.imageSmoothingEnabled = false;
  },
  present() {
    const d = this.dctx;
    d.imageSmoothingEnabled = false;
    d.drawImage(this.buf, 0, 0, this.canvas.width, this.canvas.height);
  },
};

/* ---------- Armazenamento local (protegido contra falhas) ---------- */
const Store = {
  get(key, fallback = null) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  },
  set(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; }
  },
  del(key) { try { localStorage.removeItem(key); } catch (e) { /* ok */ } },
};

/* ------------------------- Sequenciador ------------------------- */
const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function midiOf(name) {
  const m = /^([A-G])(#|b)?(-?\d)$/.exec(name);
  if (!m) return null;
  return 12 * (+m[3] + 1) + NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const CHORD_Q = {
  '': [0, 4, 7], m: [0, 3, 7], '7': [0, 4, 7, 10], m7: [0, 3, 7, 10], maj7: [0, 4, 7, 11], sus4: [0, 5, 7],
  sus2: [0, 2, 7], dim: [0, 3, 6], aug: [0, 4, 8], '6': [0, 4, 7, 9], m6: [0, 3, 7, 9],
};
function chordInfo(name) {
  const m = /^([A-G])(#|b)?(.*)$/.exec(name);
  const root = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return { root, iv: CHORD_Q[m[3]] || CHORD_Q[''] };
}
function noteName(midi) {
  const N = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  return N[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
}
/* Gera uma linha de baixo a partir dos acordes. pat (16 chars): R raiz, F quinta, O oitava, T terça, L quinta abaixo, - sustenta, . pausa */
function genBass(chords, pat, oct = 2) {
  const out = [];
  for (const ch of chords) {
    const { root, iv } = chordInfo(ch);
    const base = 12 * (oct + 1) + root;
    for (const p of pat) {
      if (p === 'R') out.push(noteName(base));
      else if (p === 'F') out.push(noteName(base + 7));
      else if (p === 'O') out.push(noteName(base + 12));
      else if (p === 'T') out.push(noteName(base + iv[1]));
      else if (p === 'L') out.push(noteName(base - 5));
      else out.push(p);
    }
  }
  return out.join(' ');
}
/* Arpejo: dígitos indexam as notas do acorde (subindo oitavas), - sustenta, . pausa */
function genArp(chords, pat, oct = 4) {
  const out = [];
  for (const ch of chords) {
    const { root, iv } = chordInfo(ch);
    const base = 12 * (oct + 1) + root;
    for (const p of pat) {
      if (p >= '0' && p <= '9') {
        const k = +p, o = Math.floor(k / iv.length);
        out.push(noteName(base + iv[k % iv.length] + 12 * o));
      } else out.push(p);
    }
  }
  return out.join(' ');
}

const Music = {
  cur: null, name: null, step: 0, next: 0, gain: null, pending: null, vol: 1,
  compile(song) {
    if (song.events) return song;
    const len = song.bars * 16;
    song.len = len;
    song.events = Array.from({ length: len }, () => []);
    for (const ch of song.ch) {
      const toks = [];
      for (const raw of ch.d.split(/\s+/)) {
        if (!raw || raw === '|') continue;
        const [t, n] = raw.split(':');
        const k = n ? +n : 1;
        toks.push(t);
        for (let i = 1; i < k; i++) toks.push(t === '.' || t === 'r' ? '.' : '-');
      }
      for (let i = 0; i < len; i++) {
        const t = toks[i % Math.max(1, toks.length)];
        if (!t || t === '-' || t === '.' || t === 'r') continue;
        if (ch.drum) {
          for (const d of t) song.events[i].push({ drum: d, vol: ch.vol || 1 });
          continue;
        }
        const m = midiOf(t);
        if (m === null) continue;
        let durSteps = 1;
        while (toks[(i + durSteps) % toks.length] === '-' && durSteps < len) durSteps++;
        song.events[i].push({ inst: INST[ch.i], f: mtof(m + (ch.tr || 0)), dur: durSteps, vol: ch.vol || 1 });
      }
    }
    return song;
  },
  _onUnlock() { if (this.pending) { const p = this.pending; this.pending = null; this.play(p.name, p.opt); } },
  play(name, opt = {}) {
    if (this.name === name && this.cur && !opt.restart) return;
    const song = SONGS[name];
    if (!song) { this.stop(opt.fadeOut ?? 10); return; }
    if (!Sfx.ctx) { this.pending = { name, opt }; this.name = name; return; }
    this.stop(opt.fadeOut ?? 6);
    this.compile(song);
    const c = Sfx.ctx;
    this.cur = song; this.name = name; this.step = 0;
    this.gain = c.createGain();
    const v = (song.vol || 1) * this.vol;
    if (opt.fadeIn) {
      this.gain.gain.setValueAtTime(0.0001, c.currentTime);
      this.gain.gain.linearRampToValueAtTime(v, c.currentTime + opt.fadeIn / FPS);
    } else this.gain.gain.value = v;
    this.gain.connect(Sfx.musBus);
    this.next = c.currentTime + 0.06;
  },
  stop(fadeFrames = 0) {
    this.pending = null;
    if (!this.cur || !Sfx.ctx) { this.cur = null; this.name = null; return; }
    const g = this.gain, c = Sfx.ctx;
    if (fadeFrames > 0) {
      g.gain.cancelScheduledValues(c.currentTime);
      g.gain.setValueAtTime(g.gain.value, c.currentTime);
      g.gain.linearRampToValueAtTime(0.0001, c.currentTime + fadeFrames / FPS);
      setTimeout(() => { try { g.disconnect(); } catch (e) { /* ok */ } }, (fadeFrames / FPS) * 1000 + 600);
    } else { try { g.disconnect(); } catch (e) { /* ok */ } }
    this.cur = null; this.name = null; this.gain = null;
  },
  /* Abaixa/volta o volume da música atual (ex.: durante diálogos importantes). */
  duck(level, frames = 10) {
    if (!this.gain || !Sfx.ctx) return;
    const c = Sfx.ctx, g = this.gain.gain, v = (this.cur.vol || 1) * level;
    g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value, c.currentTime);
    g.linearRampToValueAtTime(Math.max(0.0001, v), c.currentTime + frames / FPS);
  },
  update() {
    if (!this.cur || !Sfx.ctx) return;
    const c = Sfx.ctx;
    const stepDur = 60 / this.cur.bpm / 4;
    if (this.next < c.currentTime - 0.25) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.15) {
      this.playStep(this.step, this.next, stepDur);
      this.next += stepDur * (this.cur.swing && this.step % 2 === 0 ? 1 + this.cur.swing : this.cur.swing ? 1 - this.cur.swing : 1);
      this.step = (this.step + 1) % this.cur.len;
      if (this.step === 0 && this.cur.once) { this.stop(20); return; }
    }
  },
  playStep(i, t, sd) {
    const dest = this.gain;
    for (const e of this.cur.events[i]) {
      if (e.drum) { this.drum(e.drum, t, dest, e.vol); continue; }
      const ins = e.inst;
      Sfx.tone({ t, f: e.f, dur: Math.max(0.03, e.dur * sd - 0.01), type: ins.type, vol: ins.vol * e.vol, a: ins.a, d: ins.d, s: ins.s, r: ins.r, lp: ins.lp, vib: ins.vib, dest });
    }
  },
  drum(d, t, dest, v = 1) {
    switch (d) {
      case 'K': Sfx.tone({ t, f: 130, f2: 42, dur: 0.11, type: 'sine', vol: 0.32 * v, r: 0.04, dest }); break;
      case 'S': Sfx.noise({ t, dur: 0.1, vol: 0.13 * v, type: 'bandpass', f: 1900, q: 0.7, r: 0.05, dest }); Sfx.tone({ t, f: 200, f2: 120, dur: 0.05, type: 'triangle', vol: 0.1 * v, dest }); break;
      case 'H': Sfx.noise({ t, dur: 0.025, vol: 0.045 * v, type: 'highpass', f: 7500, r: 0.015, dest }); break;
      case 'O': Sfx.noise({ t, dur: 0.12, vol: 0.045 * v, type: 'highpass', f: 6500, r: 0.06, dest }); break;
      case 'C': Sfx.noise({ t, dur: 0.5, vol: 0.06 * v, type: 'highpass', f: 4500, r: 0.4, dest }); break;
      case 'T': Sfx.tone({ t, f: 190, f2: 95, dur: 0.12, type: 'sine', vol: 0.22 * v, dest }); break;
      case 'B': Sfx.tone({ t, f: 90, f2: 35, dur: 0.25, type: 'sine', vol: 0.3 * v, dest }); break;
      default: break;

  },

/* Faixa de chapéu: preenche as linhas [y0,y1] da elipse do chapéu. */

function drawHat(p, who, cx, cy, rx, ry, facing, o) {

    const [main, mainD, band, bandD] = who === 'stan' ? [PAL.stanHat, PAL.stanHatD, PAL.stanRed, PAL.stanRedD] : [PAL.cartHat, PAL.cartHatD, PAL.cartYellow, PAL.cartYellowD];
    hatFill(p, cx, cy, hrx, hry, top - 2, bandTop, main, mainD);
    hatFill(p, cx, cy, hrx + 0.4, hry + 0.4, bandTop, bandBot, band, bandD);
    if (!o.crown) {
      const pr = Math.max(2, ry * 0.25);
      p.ellipse(cx, top - pr * 0.25, pr, pr * 0.95, band);
      p.ellipse(cx + pr * 0.35, top - pr * 0.25, pr * 0.55, pr * 0.8, bandD, -1e9, 1e9, cx + pr * 0.2, 1e9);

    hatFill(p, cx, cy, hrx, hry, top - 2, bandTop, PAL.kyleHat, PAL.kyleHatD);
    if (!up) hatFill(p, cx, cy, hrx + 0.4, hry + 0.4, bandTop, bandBot, PAL.kyleHatL, PAL.kyleHat);

      p.ellipse(fx, (fy0 + fy1) / 2, fw, (fy1 - fy0) / 2, s === 1 ? PAL.kyleHatD : PAL.kyleHat);

}
function drawCrown(p, cx, y, rx) {
  const w = Math.max(7, Math.round(rx * 1.1)), x0 = Math.round(cx - w / 2), h = Math.max(4, Math.round(rx * 0.55));

function drawKennyHood(p, cx, cy, rx, ry, facing, expr, o) {
  const fdx = facing === 'left' ? -1 : facing === 'right' ? 1 : 0;
  p.ellipse(cx, cy, rx * 1.05, ry * 1.02, PAL.kenny);
  p.ellipse(cx, cy, rx * 1.05, ry * 1.02, PAL.kennyD, -1e9, 1e9, cx + rx * 0.55, 1e9);

  p.ellipse(ox, oy, orx + (big ? 2.4 : 1.4), ory + (big ? 2.2 : 1.3), PAL.kennyFur);
  p.ellipse(ox, oy, orx + (big ? 2.4 : 1.4), ory + (big ? 2.2 : 1.3), PAL.kennyFurD, oy + ory * 0.4, 1e9);

    p.ellipse(ox, oy, orx, ory, '#120a18');

/* Cabeça completa: pele, rosto e chapéu. */
function drawHead(p, who, cx, cy, r, o = {}) {
  const facing = o.facing || 'down', expr = o.expr || 'neutral';

/* ---------- Corpos das crianças ---------- */
const KIDS = {

  kenny: { jacket: [PAL.kenny, PAL.kennyD], pants: [PAL.kenny, PAL.kennyD], glove: PAL.kennyGlove, wf: 1, zip: false },

/* o: {facing, frame, dark, expr, handL:[x,y], handR:[x,y], weapon:{type, ang, hand:'R'}, bob, crouch, look} */
function drawKid(p, who, cx, base, o = {}) {
  const k = KIDS[who];
  const facing = o.facing || 'down', fr = o.frame || 0;
  const walkBob = fr === 1 || fr === 3 ? -1 : 0;
  const bob = walkBob + (o.bob || 0) + (o.crouch ? 1 : 0);
  const wf = k.wf;
  const tw = Math.round(7 * wf);
  const dark = !!o.dark;
  const fdx = facing === 'left' ? -1 : facing === 'right' ? 1 : 0;
  const footY = base - 2;
  const torsoTop = base - 14 + bob, torsoBot = base - 5;
  const headCy = base - 21 + bob + (who === 'cartman' ? 0 : 0), headR = who === 'cartman' ? 10 : 9.5;
  const [jc, jcd] = k.jacket, [pc, pcd] = k.pants;

  // capa (atrás)
  if (dark && (who === 'stan' || who === 'cartman') && facing !== 'up') {
    const capeC = who === 'stan' ? PAL.cape : PAL.purple, capeD = who === 'stan' ? PAL.capeD : PAL.purpleD;
    p.poly([[cx - tw - 1, torsoTop + 1], [cx + tw + 1, torsoTop + 1], [cx + tw + 3, base - 1], [cx - tw - 3, base - 1]], capeC);
    p.poly([[cx + tw * 0.4, torsoTop + 1], [cx + tw + 1, torsoTop + 1], [cx + tw + 3, base - 1], [cx + tw * 0.5, base - 1]], capeD);
  }
  // pés
  const lift = (i) => (fr === 1 && i === 0) || (fr === 3 && i === 1) ? -1 : 0;
  for (let i = 0; i < 2; i++) {
    const fx = cx + (i === 0 ? -3.6 : 3.6) * Math.min(1.25, wf) + fdx * 1.2;
    p.ellipse(fx, footY + lift(i), 3.1, 1.7, PAL.shoe);
  }
  // pernas/calça
  p.rect(cx - tw + 1, torsoBot - 1, (tw - 1) * 2, 3 - (o.crouch ? 1 : 0), pc);
  p.rect(cx - 0.5, torsoBot, 1, 2, pcd);

  if (dark && (who === 'kyle' || who === 'kenny')) {
    const rc = who === 'kyle' ? PAL.robeG : PAL.kenny, rcd = who === 'kyle' ? PAL.robeGD : PAL.kennyD;
    p.poly([[cx - tw, torsoTop + 3], [cx + tw, torsoTop + 3], [cx + tw + 1.5, base - 2], [cx - tw - 1.5, base - 2]], rc);
    p.poly([[cx + tw * 0.35, torsoTop + 3], [cx + tw, torsoTop + 3], [cx + tw + 1.5, base - 2], [cx + tw * 0.45, base - 2]], rcd);
    p.rect(cx - tw - 1, base - 3, tw * 2 + 3, 1, who === 'kyle' ? PAL.gold : PAL.purple);
  }
  // tronco
  p.rect(cx - tw + 1, torsoTop, (tw - 1) * 2, 1, jc);
  p.rect(cx - tw, torsoTop + 1, tw * 2, torsoBot - torsoTop - 1, jc);
  p.rect(cx + tw * 0.35, torsoTop + 1, tw * 0.65, torsoBot - torsoTop - 1, jcd);
  if (k.zip && facing !== 'up') p.rect(cx + fdx * 2 - 0.5, torsoTop + 2, 1, torsoBot - torsoTop - 3, jcd);
  if (who === 'kenny' && facing !== 'up') { p.px(cx - 2 + fdx, torsoTop + 1, PAL.kennyFurD); p.px(cx + 1 + fdx, torsoTop + 1, PAL.kennyFurD); }
  // armadura do Stan / detalhes do Mundo Sombrio
  if (dark && who === 'stan') {
    p.rect(cx - tw + 1, torsoTop + 1, (tw - 1) * 2, 6, PAL.steel);
    p.rect(cx + 1, torsoTop + 1, tw - 2, 6, PAL.steelD);
    p.rect(cx - tw + 2, torsoTop + 2, 2, 2, PAL.steelL);

  }

  }

    if (facing === 'up') { p.rect(cx - tw - 2, torsoTop + 1, tw * 2 + 4, base - torsoTop - 2, PAL.purple); p.rect(cx, torsoTop + 1, tw + 2, base - torsoTop - 2, PAL.purpleD); }

function drawWeapon(p, type, hx, hy, ang, layer) {
  const c = Math.cos(ang), s = Math.sin(ang), nx = -s, ny = c;
  if (type === 'sword') {
    if (layer === 'front') {
      for (let i = 3; i <= 14; i++) {
        p.px(hx + c * i, hy + s * i, PAL.steelL);
        p.px(hx + c * i + nx, hy + s * i + ny, PAL.steelD);
      }
      p.px(hx + c * 15, hy + s * 15, PAL.steelL);
    } else if (layer === 'back') {
      p.line(hx - c * 3, hy - s * 3, hx, hy, PAL.woodD, 2);
      p.px(hx - c * 4, hy - s * 4, PAL.gold);
    } else if (layer === 'guard') {
      p.line(hx + c * 2.5 + nx * 3, hy + s * 2.5 + ny * 3, hx + c * 2.5 - nx * 3, hy + s * 2.5 - ny * 3, PAL.gold, 1);
    }
  } else if (type === 'staff') {
    if (layer === 'back') p.line(hx - c * 6, hy - s * 6, hx + c * 11, hy + s * 11, PAL.wood, 1);
    if (layer === 'front') {
      p.line(hx - c * 6, hy - s * 6, hx + c * 11, hy + s * 11, PAL.wood, 1);
      p.circle(hx + c * 13, hy + s * 13, 2.8, PAL.magicD);
      p.circle(hx + c * 13 - 0.4, hy + s * 13 - 0.4, 1.9, PAL.magic);
      p.px(hx + c * 13 - 1, hy + s * 13 - 1, '#ffffff');
    }
  } else if (type === 'scythe') {
    if (layer === 'back') p.line(hx - c * 6, hy - s * 6, hx + c * 12, hy + s * 12, PAL.woodD, 1);
    if (layer === 'front') {
      p.line(hx - c * 6, hy - s * 6, hx + c * 12, hy + s * 12, PAL.wood, 1);
      const tx = hx + c * 12, ty = hy + s * 12;
      for (let t = 0; t <= 9; t++) {
        const bx = tx - nx * t - c * t * t * 0.07, by = ty - ny * t - s * t * t * 0.07;
        p.px(bx, by, PAL.steelL);
        p.px(bx - c, by - s, PAL.steelD);
      }
    }
  }
}

/* ---------- Cache de sprites ---------- */
const Spr = {

  /* Sprite de campo: who, mundo ('light'|'dark'), direção, quadro 0-3 */
  kid(who, dark, facing, frame, extra = '') {

      const wide = who === 'cartman';
      const p = new Painter(wide ? 36 : 28, 40);
      drawKid(p, who, wide ? 18 : 14, 38, { facing, frame, dark, mystery: extra === 'mystery', expr: extra && extra !== 'mystery' ? extra : 'neutral' });
      return p.outline().c;
    });
  },
  /* Sprite de batalha com pose */
  battle(who, pose, f = 0) {
    return this.get(`bat:${who}:${pose}:${f}`, () => buildBattleSprite(who, pose, f));
  },
  face(who, expr = 'neutral') {

    case 'down': {

    p.poly([[cx + 13 * k, Y(20)], [cx + 4.5 * k, Y(18)], [cx + 6 * k, Y(1.5)], [cx + 17 * k, Y(2.5)]], PAL.capeD);

  p.ellipse(cx, hy, 20 * k, 14 * k * squash, PAL.goomD, Y(24.5), Y(19));

    else {
      const pr = expr === 'shock' ? 0.9 : 1.6 * k + 0.3;

      this.active = true;
      this.pos = opts.pos || this.autoPos();
      this.style = opts.style || (G && G.dark === false ? 'light' : 'dark');
      this.nextEntry();
    });
  },
  /* Pergunta com opções (coração vermelho como cursor). Devolve o índice. */
  ask(text, options, opts = {}) {
    return new Promise((res) => {
      const e = parseLine(text);
      e.choice = options;
      e.onChoose = res;
      this.say([e], opts);
    });
  },
  nextEntry() {
    const e = this.queue.shift();
    if (!e) { this.close(); return; }
    this.entry = e;
    let text = e.text || '';
    if (!e.raw && !/^[*(\[]/.test(text)) text = '* ' + text;
    this.face = HAS_FACE(e.who) && !e.noFace ? e.who : null;
    this.voice = e.voice || (VOICES[e.who] ? e.who : 'default');
    const cols = this.face ? 29 : 35;
    const lines = Font.wrap(Font.parse(text), cols);
    this.pages = [];
    const per = e.choice ? 2 : 3;
    for (let i = 0; i < lines.length; i += per) this.pages.push(lines.slice(i, i + per));
    if (!this.pages.length) this.pages.push([]);
    this.nextPage();
  },
  nextPage() {
    this.lines = this.pages.shift();
    this.reveal = 0; this.acc = 0; this.pause = 0; this.done = false; this.autoT = 0;
    this.total = Font.count(this.lines);
    this.speed = this.entry.speed || this.opts.speed || 1;
    this.choosing = false;
    // primeiros tokens de controle
    this.flat = [];
    for (const l of this.lines) for (const t of l) this.flat.push(t);
    this.ti = 0;
  },
  close() {
    this.active = false;
    const r = this.resolve; this.resolve = null;
    if (r) r();
  },
  update() {
    if (!this.active) return;
    if (this.choosing) { this.updateChoice(); return; }
    if (!this.done) {
      if (Input.take('cancel') && !this.entry.noSkip) { this.reveal = this.total; this.done = true; Input.take('confirm'); }
      else {
        if (this.pause > 0) { this.pause--; return; }
        this.acc += this.speed;
        while (this.acc >= 1 && this.reveal < this.total) {
          // processa tokens até o próximo caractere
          while (this.ti < this.flat.length && this.flat[this.ti].ch === undefined) {
            const t = this.flat[this.ti++];
            if (t.pause) { this.pause = t.pause; }
            if (t.speed) this.speed = t.speed / 2;
            if (t.sfx) Sfx.play(t.sfx);
          }
          if (this.pause > 0) break;
          const t = this.flat[this.ti++];
          this.reveal++; this.acc -= 1;
          if (t && t.ch !== ' ' && !t.pad && this.voice !== 'none') {
            if (this.blipT <= 0 || this.speed < 1) { Sfx.blip(this.voice); this.blipT = 1; }
          }
          this.blipT--;
        }
        if (this.reveal >= this.total) this.done = true;
      }
      return;
    }
    // página completa
    if (this.entry.choice && !this.pages.length) { this.choosing = true; this.cidx = 0; return; }
    if (this.entry.auto) {
      this.autoT++;
      if (this.autoT >= this.entry.auto) this.advance();
      return;
    }
    if (Input.take('confirm')) this.advance();
  },
  advance() {
    if (this.pages.length) this.nextPage();
    else this.nextEntry();
  },
  updateChoice() {
    const n = this.entry.choice.length;
    const cols = n === 2 ? 2 : n === 4 ? 2 : 1;
    let i = this.cidx;
    if (cols === 2) {
      if (Input.take('left') && i % 2 === 1) i--;
      if (Input.take('right') && i % 2 === 0 && i + 1 < n) i++;
      if (Input.take('up') && i >= 2) i -= 2;
      if (Input.take('down') && i + 2 < n) i += 2;
    } else {
      if (Input.take('up') && i > 0) i--;
      if (Input.take('down') && i < n - 1) i++;
    }
    if (i !== this.cidx) { Sfx.play('move'); this.cidx = i; }
    if (Input.take('confirm')) {
      Sfx.play('select');
      const cb = this.entry.onChoose, idx = this.cidx;
      this.choosing = false;
      this.nextEntry();
      if (cb) cb(idx);
    }
  },
  rect() {
    const h = 76, w = 304, x = 8;
    const y = this.pos === 'top' ? 6 : H - h - 6;
    return { x, y, w, h };
  },
  draw(g) {
    if (!this.active || !this.lines) return;
    const { x, y, w, h } = this.rect();
    UI.box(g, x, y, w, h, this.style);
    let tx = x + 14;
    if (this.face) {
      const img = Spr.face(this.face, this.entry.expr || 'neutral');
      g.drawImage(img, x + 6, y + 14);
      tx = x + 58;
    }
    Font.drawRich(g, this.lines, tx, y + 8, this.reveal);
    if (this.choosing) {
      const opts = this.entry.choice, n = opts.length;
      const grid = n === 2 || n === 4;
      // com duas linhas de pergunta, a grade 2x2 sobe um pouco para caber na caixa
      const tight = grid && n === 4 && this.lines.length > 1;
      const step = grid && !tight ? 16 : 14;
      const baseY = y + 8 + this.lines.length * 16 + (grid && !tight ? 4 : 0);
      opts.forEach((o, i) => {
        let ox, oy;
        if (grid) { ox = tx + 18 + (i % 2) * 120; oy = baseY + Math.floor(i / 2) * step; }
        else { ox = tx + 18; oy = baseY + i * step; }
        Font.draw(g, o, ox, oy, i === this.cidx ? '#ffff00' : '#fff');
        if (i === this.cidx) UI.heart(g, ox - 13, oy + 5);
      });
    }
  },
};

/* ---------- Faixa "X entrou para o grupo!" ---------- */
const Banner = {
  text: null, t: 0, resolve: null, color: '#ffff00',
  show(text, color = '#ffff00', sfx = 'join') {
    Sfx.play(sfx);
    return new Promise((res) => { this.text = text; this.t = 0; this.resolve = res; this.color = color; });
  },
  update() {
    if (!this.text) return;
    this.t++;
    if ((this.t > 40 && Input.take('confirm')) || this.t > 120) {
      const r = this.resolve; this.text = null; this.resolve = null; if (r) r();

/* ---------- Transições e efeitos de tela ---------- */
const Fade = {
  a: 0, color: '#000',
  to(target, frames = 12, color = '#000') { this.color = color; return tween(this, { a: target }, frames, Ease.lin); },
  out(frames = 12, color = '#000') { return this.to(1, frames, color); },
  in(frames = 12) { return this.to(0, frames); },
  draw(g) {
    if (this.a <= 0.001) return;
    g.globalAlpha = Math.min(1, this.a); g.fillStyle = this.color; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  },
};
const Flash = {
  a: 0, color: '#fff',
  go(color = '#fff', a = 1) { this.color = color; this.a = a; },
  update() { this.a = Math.max(0, this.a - 0.08); },
  draw(g) { if (this.a > 0) { g.globalAlpha = this.a; g.fillStyle = this.color; g.fillRect(0, 0, W, H); g.globalAlpha = 1; } },
};
const Shake = {
  mag: 0, t: 0, x: 0, y: 0,
  start(mag = 3, t = 10) { this.mag = Math.max(this.mag, mag); this.t = Math.max(this.t, t); },
  update() {
    if (this.t > 0) { this.t--; this.x = U.irnd(-this.mag, this.mag); this.y = U.irnd(-this.mag, this.mag); if (this.t === 0) this.mag = 0; }
    else { this.x = 0; this.y = 0; }
  },
};

/* ---------- Menu de campo (C): ITEM / EQUIP / PODER / CONFIG ---------- */
const GEAR_ICON = () => fromRows(['....##....', '.#.####.#.', '.########.', '..##..##..', '###....###', '###....###', '..##..##..', '.########.', '.#.####.#.', '....##....'], { '#': '#ffffff' });
const FieldMenu = {
  active: false, sel: 0, mode: 'top', idx: 0, who: 0, slot: 0, list: [], msg: null, conf: 0,
  labels: ['ITEM', 'EQUIP', 'POWER', 'CONFIG'],
  open() { this.active = true; this.sel = 0; this.mode = 'top'; this.msg = null; Sfx.play('select'); },
  close() { this.active = false; Sfx.play('cancel'); },
  icons() {
    if (!this._icons) this._icons = [ICON.btn.item, ICON.btn.fight, ICON.btn.magic, GEAR_ICON()];
    return this._icons;
  },
  update() {
    if (!this.active) return;
    if (this.msg) { this.msg.t++; if (this.msg.t > 8 && (Input.take('confirm') || Input.take('cancel'))) this.msg = null; return; }
    switch (this.mode) {
      case 'top': {
        if (Input.take('left') && this.sel > 0) { this.sel--; Sfx.play('move'); }
        if (Input.take('right') && this.sel < 3) { this.sel++; Sfx.play('move'); }
        if (Input.take('cancel') || Input.take('menu')) { this.close(); return; }
        if (Input.take('confirm')) {
          Sfx.play('select');
          if (this.sel === 0) { if (!G.items.length) { Sfx.play('error'); return; } this.mode = 'items'; this.idx = 0; }
          if (this.sel === 1) { this.mode = 'equipWho'; this.who = 0; }
          if (this.sel === 2) { this.mode = 'powerWho'; this.who = 0; }
          if (this.sel === 3) { this.mode = 'config'; this.idx = 0; }
        }
        break;
      }
      case 'items': {
        this.idx = UI.nav(this.idx, G.items.length, 2);
        if (Input.take('cancel')) { this.mode = 'top'; Sfx.play('cancel'); }
        else if (Input.take('confirm')) { Sfx.play('select'); this.mode = 'itemAct'; this.slot = 0; }
        break;
      }
      case 'itemAct': {
        if (Input.take('left') || Input.take('right')) { this.slot = 1 - this.slot; Sfx.play('move'); }
        if (Input.take('cancel')) { this.mode = 'items'; Sfx.play('cancel'); }
        else if (Input.take('confirm')) {
          const it = ITEMS[G.items[this.idx]];
          if (this.slot === 1) { // jogar fora
            removeItemAt(this.idx); Sfx.play('select');
            this.msg = { t: 0, text: `* You threw away the ${it.name}.` };
            this.mode = G.items.length ? 'items' : 'top'; this.idx = Math.min(this.idx, G.items.length - 1);
          } else if (it.type !== 'heal') {
            Sfx.play('error'); this.msg = { t: 0, text: "* That's equipment. Use the EQUIP menu." };
          } else if (it.all || G.party.length === 1) {
            this.useItem(this.idx, it.all ? null : G.party[0]);
          } else { this.mode = 'itemWho'; this.who = 0; }
        }
        break;
      }
      case 'itemWho': {
        this.who = this.navWho(this.who);
        if (Input.take('cancel')) { this.mode = 'itemAct'; Sfx.play('cancel'); }
        else if (Input.take('confirm')) this.useItem(this.idx, G.party[this.who]);
        break;
      }
      case 'equipWho': case 'powerWho': {
        this.who = this.navWho(this.who);
        if (Input.take('cancel')) { this.mode = 'top'; Sfx.play('cancel'); }
        else if (Input.take('confirm')) { Sfx.play('select'); this.mode = this.mode === 'equipWho' ? 'equipSlot' : 'power'; this.slot = 0; }
        break;
      }
      case 'power': if (Input.take('cancel') || Input.take('confirm')) { this.mode = 'powerWho'; Sfx.play('cancel'); } break;
      case 'equipSlot': {
        this.slot = UI.nav(this.slot, 3, 1);
        if (Input.take('cancel')) { this.mode = 'equipWho'; Sfx.play('cancel'); }
        else if (Input.take('confirm')) {
          const id = G.party[this.who];
          const want = this.slot === 0 ? 'weapon' : 'armor';
          this.list = [];
          G.items.forEach((it, i) => { const d = ITEMS[it]; if (d.type === want && (!d.who || d.who.includes(id))) this.list.push(i); });
          if (want === 'armor') this.list.push(-1);
          if (!this.list.length) { Sfx.play('error'); this.msg = { t: 0, text: '* You have nothing to equip there.' }; }
          else { Sfx.play('select'); this.mode = 'equipItem'; this.idx = 0; }
        }
        break;
      }
      case 'equipItem': {
        this.idx = UI.nav(this.idx, this.list.length, 1);
        if (Input.take('cancel')) { this.mode = 'equipSlot'; Sfx.play('cancel'); }
        else if (Input.take('confirm')) {
          const id = G.party[this.who], e = G.equip[id], invIdx = this.list[this.idx];
          const newIt = invIdx >= 0 ? G.items[invIdx] : null;
          let old;
          if (this.slot === 0) { old = e.weapon; e.weapon = newIt; } else { old = e.armor[this.slot - 1]; e.armor[this.slot - 1] = newIt; }
          if (invIdx >= 0) G.items.splice(invIdx, 1);
          if (old) G.items.push(old);
          Sfx.play('item'); this.mode = 'equipSlot';
        }
        break;
      }
      case 'config': {
        this.idx = UI.nav(this.idx, 5, 1);
        const lr = (Input.take('right') ? 1 : 0) - (Input.take('left') ? 1 : 0);
        if (lr && this.idx <= 1) {
          const k = this.idx === 0 ? 'master' : 'music';
          Sfx.vol[k] = U.clamp(Math.round((Sfx.vol[k] + lr * 0.1) * 10) / 10, 0, 1);
          Sfx.applyVolume(); Sfx.play('move'); Game.saveConf();
        }
        if (Input.take('cancel')) { this.mode = 'top'; Sfx.play('cancel'); }
        else if (Input.take('confirm')) {
          if (this.idx === 2) { Game.conf.touch = (Game.conf.touch + 1) % 3; Game.applyConf(); Sfx.play('select'); }
          if (this.idx === 3) { Game.toggleFullscreen(); Sfx.play('select'); }
          if (this.idx === 4) { this.mode = 'quit'; this.conf = 1; Sfx.play('select'); }
        }
        break;
      }
      case 'quit': {
        if (Input.take('left') || Input.take('right')) { this.conf = 1 - this.conf; Sfx.play('move'); }
        if (Input.take('cancel')) { this.mode = 'config'; Sfx.play('cancel'); }
        else if (Input.take('confirm')) {
          if (this.conf === 0) { this.active = false; Game.toTitle(); } else { this.mode = 'config'; Sfx.play('cancel'); }
        }
        break;
      }
      default: break;
    }
  },
  navWho(i) {
    const n = G.party.length;

    if (Input.take('left')) j--; if (Input.take('right')) j++;

    if (j !== i) Sfx.play('move');
    return j;
  },
  useItem(idx, who) {

      g.drawImage(silhouette(ic[i], c), bx + 7, by + 4);
      if (on) Font.draw(g, this.labels[i], bx + 13, by + 18, '#fff', { align: 'center' });

    const n = G.party.length, bw = 106, x0 = Math.round((W - n * bw) / 2);
    G.party.forEach((id, i) => {

        this.fx.push({ type: 'beam', x0: m.x + 16, y0: m.y - 22, x1: e.x, y1: e.y - 24, t: 0, color: '#5cff6a' });
        await wait(14);
        const dmg = Math.round((stat('kyle', 'mag') * 28 + stat('kyle', 'atk') * 7) * U.rnd(0.92, 1.08));
        this.damageEnemy(e, dmg, m, true);
        await wait(24);
        break;
      }
      case 'licao': {
        await this.say('* Kyle stood on a crate.\n* "You know, I learned something today..."', {});
        for (const e of this.alive()) this.addMercy(e, 20);
        await this.say('* Everyone feels a little thoughtful.');
        break;
      }
      case 'cura': {
        const t = a.ally;
        await this.say(`* Kenny prayed to a friend he made in Hell.\n* Mmmph mmph...`, { auto: 26 });
        this.healMember(t, stat('kenny', 'mag') * 6 + 24);
        await wait(16);
        break;
      }
      case 'pacificar': {
        const e = this.retarget(a.target); if (!e) break;
        if (e.tired && (!e.def.canSpare || e.def.canSpare(this, e))) {
          await this.say(`* Kenny sang a muffled lullaby...`, { auto: 24 });
          await this.spareEnemy(e, `* ${e.name} fell asleep!`);
        } else {
          await this.say(`* Kenny tried to calm ${e.name} down...\n* But it wasn't {b}TIRED{w}.`);
        }
        break;
      }
      default: break;
    }
    if (G.hp[m.id] > 0) this.pose(m, 'idle');
  },
  addMercy(e, v) {
    if (e.gone) return;
    const before = e.mercy;
    e.mercy = U.clamp(e.mercy + v, 0, 100);
    if (e.mercy !== before) this.popup(e.x, e.y - 44, `+${e.mercy - before}%`, '#ffff00', { mini: true });
    if (e.mercy >= 100 && before < 100) Sfx.play('spare');
  },
  tire(e) { if (!e.gone && !e.tired) { e.tired = true; this.popup(e.x, e.y - 62, 'TIRED', '#5ad2ff', { mini: true }); } },

  /* ---------- minigame de ataque ---------- */
  async runQTE(fighters) {
    this.qte = { rows: fighters.map((pi, k) => ({ pi, x: 296 + k * 34 + U.irnd(0, 26), done: false, res: null, flash: 0 })) };
    this.ms = 'qte';
    await waitFor(() => this.qte.rows.every((r) => r.done));
    await wait(20);
    this.ms = null;
    this.qte = null;
  },
  updateQTE() {
    const q = this.qte; if (!q) return;
    const TX = 84;
    for (const r of q.rows) {
      if (r.flash > 0) r.flash--;
      if (r.done) continue;
      r.x -= 4.5;
      if (r.x < TX - 26) { r.done = true; r.res = 'miss'; this.attackHit(r, 0); }
    }
    if (Input.take('confirm')) {
      const live = q.rows.filter((r) => !r.done && r.x < 300).sort((a, b) => a.x - b.x);
      const r = live[0];
      if (r) {
        const d = Math.abs(r.x - TX);
        const mult = d <= 2.5 ? 1.5 : d <= 12 ? 1.15 : Math.max(0.35, 1 - (d - 12) / 90);
        r.done = true; r.res = d <= 2.5 ? 'perfect' : 'hit'; r.flash = 12;
        this.attackHit(r, mult);
      }
    }
  },
  attackHit(r, mult) {
    const m = this.party[r.pi];
    const a = this.acts[r.pi];
    const e = this.retarget(a.target);
    if (!e) return;
    if (mult <= 0) { this.popup(e.x, e.y - 30, 'MISS', '#9a9a9a'); Sfx.play('miss'); return; }
    (async () => {
      this.pose(m, 'attack'); m.animF = 0;
      Sfx.play('swing');
      for (let f = 0; f < 3; f++) { m.animF = f; await wait(3); }
      Sfx.play('slash');
      this.fx.push({ type: 'slash', x: e.x, y: e.y - 26, t: 0, color: ATTACK_COLORS[m.id], who: m.id });
      await wait(5);
      const dmg = Math.max(1, Math.round((stat(m.id, 'atk') * 7.5 * mult - e.defv * 3) * U.rnd(0.92, 1.08)));
      this.damageEnemy(e, dmg, m, mult >= 1.5);
      await wait(10);
      if (G.hp[m.id] > 0) this.pose(m, 'idle');
    })();
  },
  damageEnemy(e, dmg, by, crit) {
    if (e.gone) return;
    if (e.def.onHit) { const r = e.def.onHit(this, e, dmg, by); if (r === false) return; if (typeof r === 'number') dmg = r; }
    e.hp -= dmg;
    e.shake = 14; e.flash = 4;
    Sfx.play(crit ? 'crit' : 'hit');
    this.popup(e.x + U.irnd(-6, 6), e.y - 30, dmg, by ? ATTACK_COLORS[by.id] || '#fff' : '#fff', { big: true });
    if (e.hp <= 0) { e.hp = 0; this.defeatEnemy(e); }
    else if (!e.tired && e.def.tiredAt !== 0 && e.hp <= e.maxHp * (e.def.tiredAt || 0.3)) this.tire(e);
  },
  defeatEnemy(e) {
    if (e.def.onDefeat) { const r = e.def.onDefeat(this, e); if (r === false) return; }
    e.gone = 'defeated';
    (async () => {
      await wait(12);
      Sfx.play('flee');
      await tween(e, { fleeX: 200, alpha: 0 }, 22, Ease.in);
    })();
  },
  async spareEnemy(e, text) {
    e.gone = 'spared';
    Sfx.play('spare');
    for (let i = 0; i < 10; i++) this.fx.push({ type: 'spark', x: e.x + U.rnd(-18, 18), y: e.y - U.rnd(5, 45), vx: U.rnd(-1.5, 1.5), vy: U.rnd(-2, -0.5), t: 0 });
    e.spareFade = true;
    tween(e, { alpha: 0 }, 24, Ease.lin);
    if (e.def.onSpare) await e.def.onSpare(this, e);
    if (text) await this.say(text, { auto: 40 });
  },

  /* ---------- turno inimigo ---------- */
  async enemyTalk() {
    const list = [];
    for (const e of this.alive()) {
      const line = e.def.talk ? e.def.talk(this, e) : null;
      if (line) list.push(this.makeBubble(e.x - 30, e.y - 54, line, 'left', e.def.voice || 'monster'));
    }
    if (!list.length) return;
    await this.showBubbles(list);
  },
  makeBubble(x, y, text, side = 'left', voice = 'monster') {
    const lines = Font.wrap(Font.parse(text), 15);
    const w = Math.max(...lines.map((l) => l.filter((t) => t.ch !== undefined).length)) * 8 + 12;
    const h = lines.length * 14 + 8;
    let bx = side === 'left' ? x - w : x, by = Math.max(4, Math.min(PANEL_Y - h - 4, y - h / 2));
    bx = U.clamp(bx, 4, W - w - 4);
    return { lines, x: bx, y: by, w, h, side, px: x, py: y, reveal: 0, total: Font.count(lines), voice };
  },
  async showBubbles(list, opts = {}) {
    this.bubbles = list;
    let t = 0;
    await waitFor(() => {
      t++;
      let all = true;
      for (const b of this.bubbles) {
        if (b.reveal < b.total) { all = false; b.reveal = Math.min(b.total, b.reveal + 1); if (t % 2 === 0) Sfx.blip(b.voice); }
      }
      if (!all) { if (Input.take('cancel')) for (const b of this.bubbles) b.reveal = b.total; return false; }
      if (opts.auto && t > opts.auto) return true;
      return Input.take('confirm');
    });
    this.bubbles = [];
  },
  async enemyAttack() {
    const alive = this.alive();
    if (!alive.length) return;
    let pats;
    if (this.cfg.patterns) pats = this.cfg.patterns(this);
    else {
      const pick = U.shuffle(alive.slice()).slice(0, 2);
      pats = pick.map((e) => ({ e, id: e.def.pickPattern ? e.def.pickPattern(this, e) : U.pick(e.def.patterns) }));
    }
    pats = pats.filter((p) => p && PATTERNS[p.id]);
    if (!pats.length) return;
    const density = pats.length > 1 ? 0.65 : 1;
    const bw = Math.max(...pats.map((p) => PATTERNS[p.id].w || 76)), bh = Math.max(...pats.map((p) => PATTERNS[p.id].h || 76));
    this.box = { cx: BOX_CX, cy: BOX_CY, w: bw, h: bh, k: 0 };
    Sfx.play('appear');
    tween(this.box, { k: 1 }, 8, Ease.out);
    const lead = this.aliveParty()[0] || this.party[0];
    this.soul = { x: lead.x + 6, y: lead.y - 18, inv: 0, graze: 0 };
    await tween(this.soul, { x: BOX_CX, y: BOX_CY + (pats[0] && PATTERNS[pats[0].id].soulY || 0) }, 10, Ease.out);
    this.bullets = [];
    this.waveRuns = pats.map((p) => {
      const P = PATTERNS[p.id];
      const ctx = { e: p.e, density, t: 0, d: {}, dur: P.dur || 180 };
      if (P.init) P.init(this, ctx);
      return { P, ctx };
    });
    this.waveT = 0;
    this.waveDur = Math.max(...this.waveRuns.map((r) => r.ctx.dur));
    this.ms = 'wave';
    await waitFor(() => this.waveT >= this.waveDur || this.allDown());
    this.ms = null;
    this.lastSoul = { x: this.soul.x, y: this.soul.y };
    if (this.allDown()) { this.bullets = []; return; }
    for (const b of this.bullets) b.fade = true;
    await tween(this.box, { k: 0 }, 7, Ease.in);
    this.bullets = [];
    this.box = null; this.soul = null;
  },
  /* Área interna da caixa */
  inner() {
    const b = this.box;
    return { x: b.cx - b.w / 2, y: b.cy - b.h / 2, w: b.w, h: b.h, x2: b.cx + b.w / 2, y2: b.cy + b.h / 2, cx: b.cx, cy: b.cy };
  },
  spawn(b) {
    const o = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, ax: 0, ay: 0, r: 4, t: 0, dmg: 10, rot: 0, vr: 0, alpha: 1 }, b);
    this.bullets.push(o);
    return o;
  },
  updateWave() {
    this.waveT++;
    for (const r of this.waveRuns) { r.ctx.t++; if (r.ctx.t <= r.ctx.dur) r.P.update(this, r.ctx); }
    const s = this.soul, ib = this.inner();
    if (s) {
      const sp = 2.2;
      const dx = (Input.h('right') ? 1 : 0) - (Input.h('left') ? 1 : 0);
      const dy = (Input.h('down') ? 1 : 0) - (Input.h('up') ? 1 : 0);
      s.x = U.clamp(s.x + dx * sp, ib.x + 5, ib.x2 - 5);
      s.y = U.clamp(s.y + dy * sp, ib.y + 5, ib.y2 - 5);
      if (s.inv > 0) s.inv--;
      if (s.graze > 0) s.graze--;
    }
    for (const b of this.bullets) {
      if (b.wait > 0) { b.wait--; continue; }
      if (b.update) b.update(b, this);
      else { b.vx += b.ax; b.vy += b.ay; b.x += b.vx; b.y += b.vy; }
      b.rot += b.vr;
      b.t++;
      if (b.life && b.t >= b.life) b.dead = true;
      if (b.x < -60 || b.x > W + 60 || b.y < -80 || b.y > H + 60) b.dead = true;
      if (!s || b.dead || b.harmless || b.wait > 0) continue;
      // colisão e raspão
      let dist;
      if (b.hw) {
        const ddx = Math.max(Math.abs(s.x - b.x) - b.hw, 0), ddy = Math.max(Math.abs(s.y - b.y) - b.hh, 0);
        dist = Math.hypot(ddx, ddy);
      } else dist = Math.max(0, U.dist(s.x, s.y, b.x, b.y) - b.r);
      if (dist < 3) {
        if (s.inv <= 0) { this.hitParty(b.dmg, b.target); if (b.breakOnHit) b.dead = true; }
      } else if (dist < 15 && b.graze !== false) {
        if (!b.grazed) { b.grazed = true; this.addTP(2.2); Sfx.play('graze'); }
        else this.addTP(0.18);
        s.graze = 6;
      }
    }
    this.bullets = this.bullets.filter((b) => !b.dead);
  },
  hitParty(base, target) {
    const alive = this.aliveParty();
    if (!alive.length) return;
    const targets = target === 'all' ? alive : [target && G.hp[target.id] > 0 ? target : U.pick(alive)];
    for (const m of targets) {
      let d = Math.round(base * U.rnd(0.9, 1.1) - stat(m.id, 'def') * 1.5);
      if (m.defending) d = Math.round(d * 0.6);
      d = Math.max(1, d);
      G.hp[m.id] -= d;
      this.popup(m.x + 6, m.y - 34, d, '#ffffff', { big: true });
      m.shake = 10; this.pose(m, 'hurt', 16);
      if (G.hp[m.id] <= 0) this.downMember(m);
    }
    if (this.soul) this.soul.inv = 36;
    Sfx.play('hurt');
    Shake.start(2, 6);
  },
  downMember(m) {
    G.hp[m.id] = Math.min(G.hp[m.id], -Math.round(maxHp(m.id) * 0.25));
    this.pose(m, 'down');
    Sfx.play('down');
    this.popup(m.x + 6, m.y - 46, 'DOWN', '#ff4040', { mini: true });
    if (m.id === 'kenny') { this.kennyDied = true; Sfx.play('splat'); }
  },
  async endTurn() {
    if (this.kennyDied) {
      this.kennyDied = false;
      const stan = this.member('stan'), kyle = this.member('kyle');
      const bubbles = [];
      if (stan && G.hp.stan > 0) bubbles.push(this.makeBubble(stan.x + 18, stan.y - 40, 'OH MY GOD! THEY KILLED KENNY!', 'right', 'stan'));
      if (kyle && G.hp.kyle > 0) bubbles.push(this.makeBubble(kyle.x + 18, kyle.y - 26, 'YOU BASTARDS!', 'right', 'kyle'));
      if (bubbles.length) await this.showBubbles(bubbles, { auto: 80 });
      const k = this.member('kenny');
      if (k && G.hp.kenny <= 0) {
        G.hp.kenny = Math.round(maxHp('kenny') * 0.5);
        this.pose(k, 'idle'); Sfx.play('revive');
        this.fx.push({ type: 'heal', x: k.x, y: k.y - 18, t: 0 });
        await this.say('* Kenny came back to life.\n* Nobody knows how. Nobody asks.', { auto: 60 });
      }
    }
    for (const m of this.party) {
      if (G.hp[m.id] <= 0) {
        G.hp[m.id] += Math.ceil(maxHp(m.id) / 8);
        if (G.hp[m.id] > 0) { this.pose(m, 'idle'); this.popup(m.x + 6, m.y - 40, 'UP', '#3cff4c', { mini: true }); Sfx.play('revive'); }
      } else if (m.pose !== 'idle') this.pose(m, 'idle');
      m.defending = false;
    }
    for (const e of this.alive()) if (e.def.onTurnEnd) await e.def.onTurnEnd(this, e);
  },

  async finish(result) {
    this.choosing = false; this.ms = null;
    if (result === 'lose') {
      const s = this.soul || this.lastSoul || { x: this.party[0].x + 6, y: this.party[0].y - 18 };
      await GameOver.run(s.x, s.y);
      return 'lose';
    }
    if (result === 'win') {
      let money = 0;
      for (const e of this.enemies) if (e.gone) money += e.def.money || 0;
      if (this.cfg.money !== undefined) money = this.cfg.money;
      G.money += money;
      Music.stop(4);
      Sfx.play('victory');
      for (const m of this.party) if (G.hp[m.id] > 0) this.pose(m, 'victory');
      if (!this.cfg.noVictoryText) await this.say(`* YOU WON!\n* Got 0 EXP and ${money} D$.`);
    }
    if (this.cfg.onEnd) await this.cfg.onEnd(this, result);
    return result;
  },

  /* ---------- atualização e desenho ---------- */
  update() {
    if (!this.active) return;
    if (this.panelLines && this.panelReveal < this.panelTotal) {
      this.panelReveal = Math.min(this.panelTotal, this.panelReveal + 1);
      if (this.panelReveal % 2 === 0 && this.waitingText) Sfx.blip('default');
    }
    if (this.choosing) this.updateMenu();
    if (this.ms === 'qte') this.updateQTE();
    if (this.ms === 'wave') this.updateWave();
    for (const m of this.party) {
      if (m.shake > 0) m.shake--;
      if (m.poseT > 0) { m.poseT--; if (m.poseT === 0 && G.hp[m.id] > 0 && (m.pose === 'hurt' || m.pose === 'item' || m.pose === 'act')) m.pose = m.defending ? 'defend' : 'idle'; }
    }
    for (const e of this.enemies) { if (e.shake > 0) e.shake--; if (e.flash > 0) e.flash--; }
    for (const p of this.popups) {
      p.t++;
      if (p.t < 30) { p.y += p.vy; p.vy += 0.45; if (p.y > p.y0) { p.y = p.y0; p.vy = p.vy > 1.2 ? -p.vy * 0.4 : 0; } }
      else p.y -= 0.6;
    }
    this.popups = this.popups.filter((p) => p.t < 52);
    for (const f of this.fx) { f.t++; if (f.type === 'spark') { f.x += f.vx; f.y += f.vy; f.vy += 0.06; } }
    this.fx = this.fx.filter((f) => f.t < (f.type === 'spark' ? 40 : f.type === 'beam' ? 26 : f.type === 'heal' ? 30 : 18));
  },
  draw(g) {
    BG.battleGrid(g, frame, this.bgA);
    if (this.cfg.drawBg) this.cfg.drawBg(g, this);
    for (const e of this.enemies) this.drawEnemy(g, e);
    for (const m of this.party) this.drawMember(g, m);
    this.drawFx(g);
    if (this.box) this.drawBox(g);
    this.drawTP(g);
    this.drawPanel(g);
    for (const b of this.bubbles) this.drawBubble(g, b);
    for (const p of this.popups) {
      const a = p.t > 40 ? 1 - (p.t - 40) / 12 : 1;
      g.globalAlpha = Math.max(0, a);
      if (p.mini) Mini.draw(g, p.text, p.x, p.y, p.color, { align: 'center', outline: '#000' });
      else Font.draw(g, p.text, p.x, p.y - 8, p.color, { align: 'center', outline: '#000' });
      g.globalAlpha = 1;
    }
  },
  drawMember(g, m) {
    const hp = G.hp[m.id];
    let pose = hp <= 0 ? 'down' : m.pose;
    let f = 0;
    if (pose === 'idle') f = Math.floor((frame + m.i * 9) / 18) % 2;
    if (pose === 'attack') f = m.animF;
    if (pose === 'act' || pose === 'spell') f = Math.floor(frame / 10) % 2;
    const img = Spr.battle(m.id, pose, f);
    const sx = m.shake > 0 ? (m.shake % 2 ? 2 : -2) : 0;
    const dx = Math.round(m.x + m.off - 18 + sx), dy = Math.round(m.y - 41);
    g.drawImage(img, dx, dy);
    if (m.defending && hp > 0) {
      g.globalAlpha = 0.35 + Math.sin(frame * 0.3) * 0.15;
      g.strokeStyle = '#5ad2ff'; g.lineWidth = 1;
      g.strokeRect(dx + 6, dy + 4, 26, 38);
      g.globalAlpha = 1;
    }
  },
  enemyImg(e) {
    const f = Math.floor((frame + e.idx * 11) / 16) % 2;
    if (e.def.art) return e.def.art(this, e, f);
    return Spr.enemy(e.def.sprite || e.id, f);
  },
  drawEnemy(g, e) {
    if (e.alpha <= 0.01) return;
    const img = this.enemyImg(e);
    const sx = e.shake > 0 ? (e.shake % 2 ? 3 : -3) * (e.shake / 14) : 0;
    const dx = Math.round(e.x + e.off + e.fleeX - img.width / 2 + sx), dy = Math.round(e.y - img.height + (e.dy || 0));
    g.globalAlpha = e.alpha;
    if (e.spareFade) g.drawImage(silhouetteCached(img, '#ffffff'), dx, dy);
    else if (e.flash > 0) g.drawImage(silhouetteCached(img, '#ffffff'), dx, dy);
    else g.drawImage(img, dx, dy);
    g.globalAlpha = 1;
  },
  drawFx(g) {
    for (const f of this.fx) {
      if (f.type === 'slash') {
        const k = f.t / 18;
        g.strokeStyle = f.t % 4 < 2 ? '#ffffff' : f.color; g.lineWidth = 2;
        if (f.who === 'kyle') {
          g.globalAlpha = 1 - k; g.fillStyle = '#5cff6a';
          g.beginPath(); g.arc(f.x, f.y, 6 + k * 14, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
        } else {
          g.beginPath();
          const len = 34 * Math.min(1, f.t / 5);
          g.moveTo(f.x - 17, f.y - 17); g.lineTo(f.x - 17 + len, f.y - 17 + len);
          if (f.who === 'kenny') { g.moveTo(f.x + 17, f.y - 17); g.lineTo(f.x + 17 - len, f.y - 17 + len); }
          g.stroke();
        }
      } else if (f.type === 'spark') {
        g.globalAlpha = 1 - f.t / 40; g.drawImage(ICON.star, Math.round(f.x - 3), Math.round(f.y - 3)); g.globalAlpha = 1;
      } else if (f.type === 'heal') {
        g.globalAlpha = 1 - f.t / 30; g.fillStyle = '#3cff4c';
        for (let i = 0; i < 6; i++) g.fillRect(Math.round(f.x - 12 + i * 5), Math.round(f.y + 10 - f.t * 1.2 - (i % 2) * 6), 2, 2);
        g.globalAlpha = 1;
      } else if (f.type === 'cast') {
        g.globalAlpha = 1 - f.t / 18; g.strokeStyle = f.color;
        g.beginPath(); g.arc(f.x, f.y, f.t * 1.5, 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1;
      } else if (f.type === 'beam') {
        const k = Math.min(1, f.t / 10);
        g.globalAlpha = f.t > 16 ? 1 - (f.t - 16) / 10 : 1;
        g.strokeStyle = f.color; g.lineWidth = 6 - Math.min(4, f.t / 5);
        g.beginPath(); g.moveTo(f.x0, f.y0); g.lineTo(U.lerp(f.x0, f.x1, k), U.lerp(f.y0, f.y1, k)); g.stroke();
        g.strokeStyle = '#ffffff'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(f.x0, f.y0); g.lineTo(U.lerp(f.x0, f.x1, k), U.lerp(f.y0, f.y1, k)); g.stroke();
        g.globalAlpha = 1;
      }
    }
  },
  drawBox(g) {
    const b = this.box, k = b.k;
    const w = Math.max(2, b.w * k), h = Math.max(2, b.h * k);

  await B.showBubbles([B.makeBubble(e.x - 30, e.y - 54, text, 'left', e.def.voice || 'monster')], { auto });
}
async function memberSays(B, id, text, auto) {

}

/* Mapa a partir de retângulos "esculpidos" num fundo vazio. ops: [char, x0, y0, x1, y1] */
function carve(w, h, ops, fill = '#') {
  const m = Array.from({ length: h }, () => Array(w).fill(fill));
  for (const [ch, x0, y0, x1, y1] of ops) for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (m[y] && x < w) m[y][x] = ch;
  return m.map((r) => r.join(''));
}
function painterFor(g) { const p = Object.create(Painter.prototype); p.g = g; p.c = g.canvas; p.w = g.canvas.width; p.h = g.canvas.height; return p; }
const kidObj = (who, x, y, facing = 'down', o = {}) => Object.assign({ type: 'kid', kind: 'kid', who, x, y, facing, name_: who }, o);
const T = (tx, ty) => [tx * 16 + 8, ty * 16 + 12];
function lyingSprite(who) { return Spr.get('lying:' + who, () => rotate90(Spr.kid(who, true, 'down', 0), false)); }
function treeObj(x, y) { return { type: 'prop', name: 'tree', x, y, solid: [10, 6] }; }

function drawHouse(p, x, base, w, h, wall, wallD, roof) {
  const top = base - h;
  p.rect(x - 1, top - 1, w + 2, h + 1, PAL.ol);
  p.rect(x, top, w, h, wall);
  p.rect(x + w - 12, top, 12, h, wallD);
  p.poly([[x - 9, top + 2], [x + w / 2, top - h * 0.62 - 1], [x + w + 9, top + 2]], PAL.ol);
  p.poly([[x - 7, top + 1], [x + w / 2, top - h * 0.62], [x + w + 7, top + 1]], roof);
  p.poly([[x - 7, top + 1], [x + w / 2, top - h * 0.62], [x + w + 7, top + 1], [x + w + 3, top - 2], [x + w / 2, top - h * 0.62 + 6], [x - 3, top - 2]], '#f4f8ff');
  const dx = Math.round(x + w * 0.42);
  p.rect(dx - 1, base - 27, 16, 27, PAL.ol); p.rect(dx, base - 26, 14, 26, '#6a4428'); p.px(dx + 10, base - 13, PAL.gold);
  for (const wx of [x + 8, x + w - 32]) {
    p.rect(wx - 1, top + 13, 20, 16, PAL.ol); p.rect(wx, top + 14, 18, 14, '#ffe9a8');
    p.rect(wx + 8, top + 14, 1, 14, '#6a5040'); p.rect(wx, top + 20, 18, 1, '#6a5040');
  }
  p.rect(x - 4, base - 4, w + 8, 4, '#e4ecf8');
}
function paintTown(g, w) {
  const p = painterFor(g);
  for (let x = -10; x < w; x += 46) g.drawImage(Spr.prop('pine'), x + ((x / 46) % 2) * 14, 58);
  drawHouse(p, 22, 112, 100, 58, '#9cbad8', '#7a98bc', '#5a4a6a');
  drawHouse(p, 190, 112, 82, 50, '#e0a8a0', '#c08880', '#4a3a5a');
  drawHouse(p, 330, 112, 100, 58, '#e8d8a8', '#c8b888', '#6a3a3a');
  p.rect(0, 108, w, 4, '#e4ecf8');
}
function paintSchool(g, w) {
  const p = painterFor(g);

  p.rect(x0 - 4, top - 6, x1 - x0 + 8, 7, '#7a3a30');

  Font.draw(g, 'SOUTH PARK ELEMENTARY', 240, 27, '#2a3a8a', { align: 'center' });
  for (const wx of [76, 120, 330, 374]) for (const wy of [52, 80]) { p.rect(wx - 1, wy - 1, 28, 20, PAL.ol); p.rect(wx, wy, 26, 18, '#a8d0f0'); p.rect(wx + 12, wy, 1, 18, '#f4f0e0'); }
  p.rect(219, 64, 42, 48, PAL.ol); p.rect(220, 65, 40, 47, '#5a3a24');
  p.rect(222, 67, 17, 45, '#7a5434'); p.rect(241, 67, 17, 45, '#7a5434'); p.px(236, 90, PAL.gold); p.px(244, 90, PAL.gold);
  p.rect(210, 108, 60, 4, '#c8c8d0');
  p.rect(450, 20, 2, 92, '#9a9aa8'); p.rect(452, 22, 18, 12, '#e23030'); p.rect(452, 26, 18, 2, '#fff'); p.rect(452, 30, 18, 2, '#fff');

function paintHall(g, w) {
  const p = painterFor(g);
  p.rect(0, 0, w, 96, '#8e9ec4');
  p.rect(0, 0, w, 10, '#6e7ea4');
  p.rect(0, 92, w, 4, '#5a4a3a');

  p.rect(372, 16, 40, 14, '#ffe060'); Mini.draw(g, 'GO COWS!', 392, 21, '#2a3a8a', { align: 'center' });

async function pressSwitch(id) {
  if (hasFlag('puzzle1')) { await Dlg.say(['* (The button is already pressed down.)']); return; }
  const order = ['food', 'money', 'crown'];
  const pressed = order.filter((o) => hasFlag('sw_' + o));
  if (hasFlag('sw_' + id)) return;
  if (order[pressed.length] === id) {
    setFlag('sw_' + id); Sfx.play('switch');
    if (pressed.length === 2) {
      await wait(10);
      Sfx.play('save'); setFlag('puzzle1'); Shake.start(1, 10);
      await Dlg.say(['* (The spikes sank into the ground!)']);
      await goombaFight1();
    }
  } else {
    Sfx.play('error');
    for (const o of order) G.flags['sw_' + o] = false;
    await Dlg.say(['* (Bzzzt! The buttons popped back up.)']);
    if (World.find('goomba')) await Dlg.say(['goomba/happy: HO HO HO! WRONG!']);
  }
}

  Music.play('field', { fadeIn: 20 });

function drawFountain(g, x, y, k = 1) {
  if (k <= 0.01) return;
  g.save();
  g.fillStyle = '#000';
  g.beginPath(); g.ellipse(x, y + 6, 26 * k + 4, 8 * k + 2, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#d0d0f0'; g.lineWidth = 1;
  g.beginPath(); g.ellipse(x, y + 6, 26 * k + 4, 8 * k + 2, 0, 0, Math.PI * 2); g.stroke();
  const wdt = 18 * k;
  for (let yy = y + 4; yy > -10; yy -= 2) {
    const off = Math.sin(yy * 0.12 + frame * 0.15) * 2.5 * k;
    g.fillStyle = '#000'; g.fillRect(Math.round(x - wdt + off), yy, Math.round(wdt * 2), 2);
    g.fillStyle = '#e8e8ff'; g.fillRect(Math.round(x - wdt + off) - 1, yy, 1, 2); g.fillRect(Math.round(x + wdt + off), yy, 1, 2);
  }
  for (let i = 0; i < 14; i++) {
    const py = (y - ((frame * 1.5 + i * 23) % (y + 20)));
    const px = x + Math.sin(i * 2.1 + frame * 0.05) * wdt * 0.8;
    g.fillStyle = i % 3 ? '#ffffff' : '#a080ff';
    g.fillRect(Math.round(px), Math.round(py), 1, 2);
  }
  g.restore();
}

const Scenes = {

  /* Executa uma cena de tela cheia: draw(g, t) por quadro até done() ser verdadeiro. */
  async custom(draw, frames, opts = {}) {
    const prev = Game.mode;
    Game.mode = 'custom';
    let t = 0;
    Game.customDraw = (g) => { draw(g, t); };
    await waitFor(() => { t++; return t >= frames || (opts.skippable && Input.take('cancel')); });
    Game.customDraw = null;

  },

  /* Queda pelo armário até o Mundo Sombrio */
  async fall() {
    Sfx.play('fall');
    const parts = Array.from({ length: 40 }, (_, i) => ({ x: U.rnd(0, W), y: U.rnd(0, H), s: U.rnd(2, 6) }));
    Fade.a = 0;
    await this.custom((g, t) => {
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      for (const p of parts) {
        p.y -= p.s; if (p.y < -10) { p.y = H + 10; p.x = U.rnd(0, W); }
        g.fillStyle = t > 70 ? '#8a4ac0' : '#5a5a7a';
        g.fillRect(Math.round(p.x), Math.round(p.y), 1, Math.round(p.s * 2));
      }
      const dark = t > 70;
      const y = -40 + Math.min(1, t / 90) * 150;
      const sway = Math.sin(t * 0.05) * 6;
      const s1 = Spr.kid('stan', dark, t % 40 < 20 ? 'down' : 'left', 0), s2 = Spr.kid('kyle', dark, t % 40 < 20 ? 'right' : 'down', 0);
      g.drawImage(s1, Math.round(130 + sway - s1.width / 2), Math.round(y));
      g.drawImage(s2, Math.round(186 - sway - s2.width / 2), Math.round(y + 14));
      if (t === 70) { Flash.go('#ffffff', 1); Sfx.play('bell'); }
      if (t > 120) { g.globalAlpha = Math.min(1, (t - 120) / 30); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
    }, 150);
    Fade.color = '#ffffff'; Fade.a = 1;

  /* A lenda contada pelo Kenny */
  async legend() {
    const steps = [
      { img: 'fountain', text: 'WHEN A GREEDY EMPEROR OPENS THE FOUNTAIN OF DARKNESS...' },

    await Fade.out(14);

      const lines = Font.wrap(Font.parse(s.text), 30);
      const total = Font.count(lines);
      let shown = 0, t = 0, done = false;
      Fade.a = 0;
      const prev = Game.mode;
      Game.mode = 'custom';
      Game.customDraw = (g) => {
        g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
        const a = Math.min(1, t / 20);

      ['SOUTHRUNE', '#ffffff', 2], ["Chapter 1: The Emperor's Fountain", '#ffff00'], [''],
      ['A non-profit fan game.'], [''],
      ['Inspired by DELTARUNE by Toby Fox.'], ['South Park was created by'], ['Trey Parker and Matt Stone.'], ['Goomba is a Nintendo character.'], [''],
      ['CAST', '#ffff00'],
      ['STAN ........ Beanie Knight'], ['KYLE ........ Green Hat Mage'], ['KENNY ....... Hooded Immortal'], ['CARTMAN ..... the Emperor'], ['SIR GOOMBA .. Caped Knight'],
      ['BUTTERS ..... Shopkeeper'], ["MR. MACKEY .. Counselor, m'kay"], ['MANBEARPIG .. super cereal'], ['MR. HAT ..... himself'], [''],
      ['Script, art, music and code'], ['made with Claude (Anthropic).'], ['Text in GNU Unifont.'], [''],
      ['No Kennys were harmed in the'], ['making of this game.'], ["(Okay, that's a lie.)", '#a0a0b0'], [''],
      ['THANKS FOR PLAYING!', '#ff9a1f'],
    ];
    const ys = [];
    let acc = 0;
    for (const [, , sc = 1] of lines) { ys.push(acc); acc += 18 * sc + (sc > 1 ? 6 : 0); }
    const total = acc + H + 40;
    await Fade.to(0, 1);
    await this.custom((g, t) => {
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      const y0 = H - t * 0.55;
      lines.forEach(([txt, col = '#ffffff', sc = 1], i) => {
        const y = y0 + ys[i];
        if (y < -40 || y > H + 10) return;
        Font.draw(g, txt, W / 2, y, col, { align: 'center', scale: sc });
      });
      const k = Math.floor(t / 20) % 2;
      g.drawImage(Spr.goombaField(k ? 2 : 3), 8 + ((t * 0.4) % (W + 40)) - 20, H - 40);
    }, Math.round(total / 0.55), { skippable: true });
    // epílogo
    Music.stop(20);
    await this.custom((g, t) => {
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      const a = Math.min(1, t / 40);
      g.globalAlpha = a;
      Font.draw(g, '* Later that night...', W / 2, 60, '#ffffff', { align: 'center' });
      if (t > 80) {
        g.drawImage(Spr.prop('closetOpen'), 147, 100);
        if (Math.floor(t / 10) % 3 === 0) { g.fillStyle = '#8a4ac0'; g.fillRect(150, 141, 20, 2); }
        if (t > 150) Font.draw(g, '* (The closet door creaked open.)', W / 2, 160, '#c0c0c0', { align: 'center' });
      }
      if (t > 230) Font.draw(g, 'CHAPTER 2: COMING SOON?', W / 2, 200, '#ffff00', { align: 'center' });
      g.globalAlpha = 1;
    }, 330, { skippable: true });
    await Fade.out(30);
    Store.set('southrune_cleared', true);
    Game.toTitle();
  },
};

/* ---------- Tela de título ---------- */
const Title = {
  idx: 0, t: 0, opts: [], conf: false,
  enter() {
    this.t = 0; this.idx = 0; this.conf = false;
    this.opts = Save.exists() ? ['CONTINUE', 'NEW GAME', 'CONFIG'] : ['START', 'CONFIG'];
    Music.play('intro', { fadeIn: 30 });
    Fade.a = 1; Fade.in(30);
  },
  update() {
    this.t++;
    if (this.conf) { this.updateConf(); return; }
    if (this.t < 20) return;
    if (Input.take('up') && this.idx > 0) { this.idx--; Sfx.play('move'); }
    if (Input.take('down') && this.idx < this.opts.length - 1) { this.idx++; Sfx.play('move'); }
    if (Input.take('confirm')) {
      const o = this.opts[this.idx];
      Sfx.play('select');
      if (o === 'CONFIG') { this.conf = true; this.cidx = 0; return; }
      if (o === 'CONTINUE') Game.continueGame();
      else if (o === 'NEW GAME') { this.confirmNew = true; Game.newGameFlow(); }
      else Game.newGameFlow();
    }
  },
  updateConf() {
    const n = 4;
    if (Input.take('up') && this.cidx > 0) { this.cidx--; Sfx.play('move'); }
    if (Input.take('down') && this.cidx < n - 1) { this.cidx++; Sfx.play('move'); }
    const lr = (Input.take('right') ? 1 : 0) - (Input.take('left') ? 1 : 0);
    if (lr && this.cidx <= 1) {
      const k = this.cidx === 0 ? 'master' : 'music';
      Sfx.vol[k] = U.clamp(Math.round((Sfx.vol[k] + lr * 0.1) * 10) / 10, 0, 1); Sfx.applyVolume(); Sfx.play('move'); Game.saveConf();
    }
    if (Input.take('confirm')) {
      if (this.cidx === 2) { Game.conf.touch = (Game.conf.touch + 1) % 3; Game.applyConf(); Sfx.play('select'); }
      if (this.cidx === 3) { this.conf = false; Sfx.play('cancel'); }
    }
    if (Input.take('cancel')) { this.conf = false; Sfx.play('cancel'); }
  },
  drawLogo(g, cx, cy) {
    const t = this.t;
    // emblema: círculo com asas e montanhas (a "Runa do Sul")
    g.save();
    g.globalAlpha = 0.9;
    g.strokeStyle = '#ffffff'; g.lineWidth = 1;
    g.beginPath(); g.arc(cx, cy - 46, 12, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#ffffff';
    g.beginPath(); g.moveTo(cx - 9, cy - 40); g.lineTo(cx - 3, cy - 50); g.lineTo(cx, cy - 46); g.lineTo(cx + 4, cy - 52); g.lineTo(cx + 9, cy - 40); g.closePath(); g.fill();
    for (const s of [-1, 1]) {
      g.beginPath(); g.moveTo(cx + s * 13, cy - 48); g.lineTo(cx + s * 34, cy - 58); g.lineTo(cx + s * 30, cy - 50); g.lineTo(cx + s * 38, cy - 50); g.lineTo(cx + s * 30, cy - 44); g.lineTo(cx + s * 14, cy - 43); g.closePath(); g.fill();
    }
    g.drawImage(ICON.soul, cx - 4, cy - 30);
    g.restore();
    Font.draw(g, 'SOUTHRUNE', cx + 2, cy - 18 + 2, '#3a1d5c', { align: 'center', scale: 3 });
    Font.draw(g, 'SOUTHRUNE', cx, cy - 18, '#ffffff', { align: 'center', scale: 3 });
    Font.draw(g, "CHAPTER 1: THE EMPEROR'S FOUNTAIN", cx, cy + 28, '#c0c0d0', { align: 'center' });
    void t;
  },
  draw(g) {
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    // partículas subindo (como pó de escuridão)
    for (let i = 0; i < 40; i++) {
      const x = (U.hash(i, 3) * W + Math.sin(this.t * 0.01 + i) * 10 + W) % W;
      const y = H - ((this.t * (0.2 + U.hash(i, 4) * 0.5) + U.hash(i, 5) * H) % (H + 20));
      g.fillStyle = i % 4 === 0 ? '#8a4ac0' : '#3a1d5c';
      g.fillRect(Math.round(x), Math.round(y), 1, 2);
    }
    // silhuetas dos heróis
    const heads = ['stan', 'kyle', 'kenny', 'cartman'];
    heads.forEach((h, i) => {
      const img = Spr.kid(h, true, 'down', 0);
      g.globalAlpha = 0.35;
      g.drawImage(silhouetteCached(img, '#3a1d5c'), 52 + i * 62 - img.width / 2, 178 - img.height);
      g.globalAlpha = 1;
    });
    this.drawLogo(g, W / 2, 92);
    if (this.conf) { this.drawConf(g); return; }
    this.opts.forEach((o, i) => {
      const y = 152 + i * 18;
      Font.draw(g, o, W / 2, y, i === this.idx ? '#ffff00' : '#ffffff', { align: 'center' });
      if (i === this.idx) UI.heart(g, W / 2 - Font.width(o) / 2 - 14, y + 5);
    });
    if (Save.exists() && this.opts[this.idx] === 'CONTINUE') {
      const s = Save.info();
      Mini.draw(g, `${(s.saveRoomName || '').toUpperCase().slice(0, 34)}  ${fmtTime(s.time || 0)}`, W / 2, 210, '#8a8aa0', { align: 'center' });
    }
    Mini.draw(g, 'UNOFFICIAL FAN GAME - INSPIRED BY DELTARUNE', W / 2, H - 14, '#5a5a6a', { align: 'center' });
  },
  drawConf(g) {
    UI.box(g, 40, 140, 240, 88, 'dark');
    const touchLbl = ['AUTO', 'ALWAYS', 'NEVER'][Game.conf.touch];
    const rows = [['Master Volume', `< ${Math.round(Sfx.vol.master * 100)}% >`], ['Music', `< ${Math.round(Sfx.vol.music * 100)}% >`], ['Touch Controls', touchLbl], ['Return', '']];
    rows.forEach(([a, b], i) => {
      const y = 148 + i * 18;
      Font.draw(g, a, 66, y, i === this.cidx ? '#ffff00' : '#fff');
      Font.draw(g, b, 270, y, '#fff', { align: 'right' });
      if (i === this.cidx) UI.heart(g, 52, y + 5);
    });
  },
};
